server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Proxy API requests to backend server container
    location /api {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        # $http_host keeps the port (localhost:5173). The server's Origin check
        # (server/src/middleware/auth.js requireOrigin) compares the Origin host,
        # port included, with Host; $host drops the port and sign-in fails with
        # 403 ORIGIN_NOT_ALLOWED.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
