name: Feature
description: A feature or requirement to build
title: "[Feature] "
labels: []
body:
  - type: input
    id: requirement
    attributes:
      label: Linked FR / BR
      description: Requirement IDs from docs/srs.md this feature serves.
      placeholder: FR-1, BR-1
    validations:
      required: true
  - type: input
    id: feature_id
    attributes:
      label: Feature ID
      description: ID from docs/features.md.
      placeholder: F-1
    validations:
      required: true
  - type: input
    id: sprint
    attributes:
      label: Sprint
      placeholder: Sprint 1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One testable criterion per line, with an ID.
      placeholder: "- AC-1.1: ..."
    validations:
      required: true
  - type: input
    id: test_id
    attributes:
      label: Test ID
      description: Test IDs that verify the acceptance criteria (from the sprint test specification).
      placeholder: T-1.1
    validations:
      required: true
