<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>Architecture of the Habit Tracker at v1.0</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#fff"/>

  <rect x="20" y="105" width="150" height="90" rx="8" fill="#eef4fb" stroke="#185fa5"/>
  <text x="95" y="135" text-anchor="middle" font-weight="bold" fill="#0c447c">Browser</text>
  <text x="95" y="157" text-anchor="middle" fill="#0c447c">React app</text>
  <text x="95" y="177" text-anchor="middle" fill="#0c447c" font-size="12">screens, early checks</text>

  <rect x="225" y="25" width="370" height="250" rx="10" fill="#fafafa" stroke="#555" stroke-dasharray="6 4"/>
  <text x="240" y="47" fill="#333" font-weight="bold">One Node.js container (ADR 0024)</text>

  <rect x="245" y="62" width="330" height="40" rx="6" fill="#fff" stroke="#555"/>
  <text x="410" y="87" text-anchor="middle" fill="#222">Static files: the built React app</text>

  <rect x="245" y="115" width="330" height="40" rx="6" fill="#f1efe8" stroke="#555"/>
  <text x="410" y="140" text-anchor="middle" fill="#222">Middleware: Origin, session, role</text>

  <rect x="245" y="165" width="155" height="40" rx="6" fill="#fff" stroke="#555"/>
  <text x="322" y="190" text-anchor="middle" fill="#222">Routes (HTTP)</text>
  <rect x="420" y="165" width="155" height="40" rx="6" fill="#fdf3e3" stroke="#854f0b"/>
  <text x="497" y="190" text-anchor="middle" fill="#633806">Services (rules)</text>

  <rect x="245" y="218" width="330" height="40" rx="6" fill="#fff" stroke="#555"/>
  <text x="410" y="243" text-anchor="middle" fill="#222">Prisma client</text>

  <path d="M650 120 a40 12 0 0 1 80 0 v70 a40 12 0 0 1 -80 0 z" fill="#e8f5ee" stroke="#0f6e56"/>
  <ellipse cx="690" cy="120" rx="40" ry="12" fill="#e8f5ee" stroke="#0f6e56"/>
  <text x="690" y="162" text-anchor="middle" fill="#085041" font-weight="bold">PostgreSQL</text>
  <text x="690" y="182" text-anchor="middle" fill="#085041" font-size="12">constraints</text>

  <line x1="170" y1="150" x2="243" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="150" y="222" text-anchor="middle" fill="#333" font-size="12">HTTP, JSON,</text>
  <text x="150" y="238" text-anchor="middle" fill="#333" font-size="12">session cookie</text>
  <line x1="400" y1="185" x2="418" y2="185" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="497" y1="205" x2="497" y2="216" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="575" y1="238" x2="648" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
