<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Three-sprint roadmap: 17 features and their dependencies</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#444" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#fff"/>

  <rect x="10" y="10" width="300" height="420" rx="10" fill="#f4f8fd" stroke="#b5d4f4"/>
  <rect x="320" y="10" width="215" height="420" rx="10" fill="#f1faf6" stroke="#9fe1cb"/>
  <rect x="545" y="10" width="205" height="420" rx="10" fill="#fdf7ec" stroke="#fac775"/>
  <text x="160" y="34" text-anchor="middle" font-weight="bold" fill="#0c447c">Sprint 1 (Deliverable 1)</text>
  <text x="160" y="52" text-anchor="middle" font-size="11" fill="#0c447c">build order, top to bottom</text>
  <text x="427" y="34" text-anchor="middle" font-weight="bold" fill="#085041">Sprint 2 (29 Nov)</text>
  <text x="427" y="52" text-anchor="middle" font-size="11" fill="#085041">needs the Sprint 1 release</text>
  <text x="647" y="34" text-anchor="middle" font-weight="bold" fill="#633806">Sprint 3 (13 Dec)</text>
  <text x="647" y="52" text-anchor="middle" font-size="11" fill="#633806">then hardening</text>

  <g fill="#fff" stroke="#185fa5">
    <rect x="95" y="70" width="130" height="44" rx="6"/>
    <rect x="95" y="130" width="130" height="44" rx="6"/>
    <rect x="20" y="190" width="130" height="44" rx="6"/>
    <rect x="170" y="190" width="130" height="44" rx="6"/>
    <rect x="95" y="250" width="130" height="44" rx="6"/>
    <rect x="20" y="310" width="130" height="44" rx="6"/>
    <rect x="170" y="310" width="130" height="44" rx="6"/>
    <rect x="20" y="370" width="130" height="44" rx="6"/>
    <rect x="170" y="370" width="130" height="44" rx="6"/>
  </g>
  <g fill="#0c447c" text-anchor="middle">
    <text x="160" y="88" font-weight="bold">F-01</text><text x="160" y="105" font-size="11">Login and session</text>
    <text x="160" y="148" font-weight="bold">F-02</text><text x="160" y="165" font-size="11">Roles and protection</text>
    <text x="85" y="208" font-weight="bold">F-03</text><text x="85" y="225" font-size="11">Create templates</text>
    <text x="235" y="208" font-weight="bold">F-06</text><text x="235" y="225" font-size="11">Participant view</text>
    <text x="160" y="268" font-weight="bold">F-07</text><text x="160" y="285" font-size="11">Goals</text>
    <text x="85" y="328" font-weight="bold">F-04</text><text x="85" y="345" font-size="11">Edit template</text>
    <text x="235" y="328" font-weight="bold">F-08</text><text x="235" y="345" font-size="11">Daily entries</text>
    <text x="85" y="388" font-weight="bold">F-09</text><text x="85" y="405" font-size="11">Progress</text>
    <text x="235" y="388" font-weight="bold">F-10</text><text x="235" y="405" font-size="11">Privacy</text>
  </g>
  <g stroke="#444" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <line x1="160" y1="114" x2="160" y2="128"/>
    <line x1="140" y1="174" x2="95" y2="188"/>
    <line x1="180" y1="174" x2="225" y2="188"/>
    <line x1="150" y1="212" x2="168" y2="212"/>
    <line x1="95" y1="234" x2="140" y2="248"/>
    <line x1="225" y1="234" x2="180" y2="248"/>
    <line x1="140" y1="294" x2="95" y2="308"/>
    <line x1="180" y1="294" x2="225" y2="308"/>
    <line x1="215" y1="354" x2="105" y2="368"/>
    <line x1="235" y1="354" x2="235" y2="368"/>
  </g>

  <g fill="#fff" stroke="#0f6e56">
    <rect x="332" y="70" width="190" height="44" rx="6"/>
    <rect x="332" y="130" width="190" height="44" rx="6"/>
    <rect x="332" y="190" width="190" height="44" rx="6"/>
    <rect x="332" y="250" width="190" height="44" rx="6"/>
    <rect x="332" y="310" width="190" height="44" rx="6"/>
    <rect x="332" y="370" width="190" height="44" rx="6"/>
  </g>
  <g fill="#085041">
    <text x="342" y="88"><tspan font-weight="bold">F-05</tspan> Retire template</text><text x="342" y="105" font-size="11">needs F-03, F-07</text>
    <text x="342" y="148"><tspan font-weight="bold">F-11</tspan> Calendar and panel</text><text x="342" y="165" font-size="11">needs F-08, F-09</text>
    <text x="342" y="208"><tspan font-weight="bold">F-12</tspan> Day colours</text><text x="342" y="225" font-size="11">needs F-11</text>
    <text x="342" y="268"><tspan font-weight="bold">F-13</tspan> Edit or delete entry</text><text x="342" y="285" font-size="11">needs F-08, F-09</text>
    <text x="342" y="328"><tspan font-weight="bold">F-14</tspan> Change goal target</text><text x="342" y="345" font-size="11">needs F-07, F-09</text>
    <text x="342" y="388"><tspan font-weight="bold">F-15</tspan> Calendar / List</text><text x="342" y="405" font-size="11">needs F-11</text>
  </g>

  <g fill="#fff" stroke="#854f0b">
    <rect x="555" y="70" width="185" height="44" rx="6"/>
    <rect x="555" y="130" width="185" height="44" rx="6"/>
  </g>
  <g fill="#633806">
    <text x="565" y="88"><tspan font-weight="bold">F-16</tspan> Streaks</text><text x="565" y="105" font-size="11">needs F-08, F-13</text>
    <text x="565" y="148"><tspan font-weight="bold">F-17</tspan> Stored reminder</text><text x="565" y="165" font-size="11">needs F-07</text>
  </g>
  <text x="565" y="210" font-size="11" fill="#633806">Hardening: integration,</text>
  <text x="565" y="226" font-size="11" fill="#633806">failure handling, usability,</text>
  <text x="565" y="242" font-size="11" fill="#633806">regression tests, defect fixes</text>

  <text x="10" y="455" font-size="11" fill="#444">Arrows show build order inside Sprint 1. "needs" lists the features a later feature depends on (Part B.1).</text>
</svg>
