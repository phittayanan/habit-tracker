<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Sprint 1 data model at v1.0</title>
  <rect x="0" y="0" width="760" height="340" fill="#fff"/>

  <rect x="20" y="20" width="230" height="130" rx="6" fill="#fff" stroke="#333"/>
  <rect x="20" y="20" width="230" height="26" rx="6" fill="#eef4fb" stroke="#333"/>
  <text x="135" y="38" text-anchor="middle" font-weight="bold">User</text>
  <text x="30" y="64">id (PK)</text>
  <text x="30" y="82">username (unique)</text>
  <text x="30" y="100">display_name</text>
  <text x="30" y="118">role: PARTICIPANT | MANAGER</text>
  <text x="30" y="136">password_hash</text>

  <rect x="20" y="220" width="230" height="94" rx="6" fill="#fff" stroke="#333"/>
  <rect x="20" y="220" width="230" height="26" rx="6" fill="#eef4fb" stroke="#333"/>
  <text x="135" y="238" text-anchor="middle" font-weight="bold">Session</text>
  <text x="30" y="264">id (PK, random)</text>
  <text x="30" y="282">user_id (FK, cascade)</text>
  <text x="30" y="300">created_at, expires_at</text>

  <rect x="330" y="20" width="200" height="130" rx="6" fill="#fff" stroke="#333"/>
  <rect x="330" y="20" width="200" height="26" rx="6" fill="#eef4fb" stroke="#333"/>
  <text x="430" y="38" text-anchor="middle" font-weight="bold">Template</text>
  <text x="340" y="64">id (PK)</text>
  <text x="340" y="82">name (unique), unit</text>
  <text x="340" y="100">min_value &lt; max_value</text>
  <text x="340" y="118">state: ACTIVE | RETIRED</text>
  <text x="340" y="136">created_by (FK User)</text>

  <rect x="330" y="200" width="200" height="130" rx="6" fill="#fff" stroke="#333"/>
  <rect x="330" y="200" width="200" height="26" rx="6" fill="#eef4fb" stroke="#333"/>
  <text x="430" y="218" text-anchor="middle" font-weight="bold">Goal</text>
  <text x="340" y="244">id (PK)</text>
  <text x="340" y="262">participant_id (FK User)</text>
  <text x="340" y="280">template_id (FK)</text>
  <text x="340" y="298">daily_target &gt; 0</text>
  <text x="340" y="316">start_date &lt;= end_date</text>

  <rect x="560" y="200" width="185" height="112" rx="6" fill="#fff" stroke="#333"/>
  <rect x="560" y="200" width="185" height="26" rx="6" fill="#eef4fb" stroke="#333"/>
  <text x="652" y="218" text-anchor="middle" font-weight="bold">Entry</text>
  <text x="570" y="244">id (PK)</text>
  <text x="570" y="262">goal_id (FK)</text>
  <text x="570" y="280">entry_date, value</text>
  <text x="570" y="298">unique (goal, date)</text>

  <g stroke="#333" stroke-width="1.2" fill="none">
    <line x1="60" y1="150" x2="60" y2="220"/>
    <line x1="250" y1="60" x2="330" y2="60"/>
    <path d="M250 130 L290 130 L290 265 L330 265"/>
    <line x1="430" y1="150" x2="430" y2="200"/>
    <line x1="530" y1="256" x2="560" y2="256"/>
  </g>
  <g font-size="11" fill="#333">
    <text x="66" y="164">1</text><text x="66" y="214">many</text>
    <text x="256" y="54">1</text><text x="300" y="54">many</text>
    <text x="256" y="124">1</text><text x="296" y="259">many</text>
    <text x="436" y="164">1</text><text x="436" y="194">many</text>
    <text x="533" y="250">1</text><text x="531" y="272">many</text>
  </g>
  <g font-size="11" fill="#555">
    <text x="258" y="76">creates</text>
    <text x="296" y="200">owns</text>
    <text x="440" y="180">used by</text>
    <text x="72" y="190">has</text>
  </g>
</svg>
