<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <title>Three-sprint timeline with checkpoints, labs and exam periods</title>
  <rect x="0" y="0" width="760" height="330" fill="#fff"/>

  <g stroke="#ddd">
    <line x1="110" y1="40" x2="110" y2="290"/>
    <line x1="229" y1="40" x2="229" y2="290"/>
    <line x1="373.5" y1="40" x2="373.5" y2="290"/>
    <line x1="492.5" y1="40" x2="492.5" y2="290"/>
    <line x1="628.5" y1="40" x2="628.5" y2="290"/>
  </g>
  <g fill="#555" text-anchor="middle">
    <text x="110" y="30">1 Oct</text>
    <text x="229" y="30">15 Oct</text>
    <text x="373.5" y="30">1 Nov</text>
    <text x="492.5" y="30">15 Nov</text>
    <text x="628.5" y="30">1 Dec</text>
  </g>

  <g fill="#333" font-weight="bold">
    <text x="10" y="74">Sprint 1</text>
    <text x="10" y="114">Sprint 2</text>
    <text x="10" y="154">Sprint 3</text>
    <text x="10" y="194">Exams</text>
    <text x="10" y="234">Checkpoints</text>
    <text x="10" y="274">Labs due</text>
  </g>

  <rect x="152.5" y="58" width="297.5" height="24" rx="4" fill="#e6f1fb" stroke="#185fa5"/>
  <text x="162" y="74" fill="#0c447c">Launch 6 Oct → F-01 to F-04, F-06 to F-10</text>
  <path d="M450 62 l8 8 l-8 8 l-8 -8 z" fill="#185fa5"/>
  <text x="462" y="74" fill="#0c447c">v1.0, 10 Nov</text>

  <rect x="458.5" y="98" width="153" height="24" rx="4" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="466" y="114" fill="#085041">F-05, F-11 to F-15</text>

  <rect x="620" y="138" width="110.5" height="24" rx="4" fill="#faeeda" stroke="#854f0b"/>
  <text x="612" y="154" fill="#633806" text-anchor="end">F-16, F-17, hardening</text>

  <rect x="203.5" y="178" width="110.5" height="24" rx="4" fill="#f1efe8" stroke="#888780"/>
  <text x="258.75" y="194" fill="#444" text-anchor="middle">12–25 Oct</text>
  <rect x="628.5" y="178" width="85" height="24" rx="4" fill="#f1efe8" stroke="#888780"/>
  <text x="671" y="194" fill="#444" text-anchor="middle">1–11 Dec</text>

  <g fill="#333">
    <path d="M492.5 222 l8 8 l-8 8 l-8 -8 z"/>
    <path d="M611.5 222 l8 8 l-8 8 l-8 -8 z"/>
    <path d="M730.5 222 l8 8 l-8 8 l-8 -8 z"/>
  </g>
  <g fill="#333">
    <text x="480" y="234" text-anchor="end">D1 15 Nov (LEB2)</text>
    <text x="604" y="250" text-anchor="end">D2 29 Nov</text>
    <text x="722" y="250" text-anchor="end">Final 13 Dec</text>
  </g>

  <g fill="#888780">
    <circle cx="492.5" cy="270" r="6"/>
    <circle cx="552" cy="270" r="6"/>
    <circle cx="611.5" cy="270" r="6"/>
  </g>
  <g fill="#444" text-anchor="middle">
    <text x="492.5" y="292">Lab 5</text>
    <text x="552" y="292">Lab 6</text>
    <text x="611.5" y="292">Lab 7</text>
  </g>

  <text x="10" y="320" font-size="11" fill="#555">Dates: Group Work Specification §4; D1 due date read on LEB2 on 2026-11-13 (the handout said 8 Nov). v1.0 tag date from Git.</text>
</svg>
