<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>Three-sprint timeline with checkpoints, labs and exams</title>
  <rect x="0" y="0" width="760" height="400" fill="#fff"/>

  <g stroke="#e3e3e3">
    <line x1="143.9" y1="48" x2="143.9" y2="350"/>
    <line x1="240.9" y1="48" x2="240.9" y2="350"/>
    <line x1="337.9" y1="48" x2="337.9" y2="350"/>
    <line x1="434.9" y1="48" x2="434.9" y2="350"/>
    <line x1="531.9" y1="48" x2="531.9" y2="350"/>
    <line x1="628.9" y1="48" x2="628.9" y2="350"/>
    <line x1="725.9" y1="48" x2="725.9" y2="350"/>
  </g>
  <g fill="#666" font-size="13" text-anchor="middle">
    <text x="143.9" y="36">2 Nov</text>
    <text x="240.9" y="36">9 Nov</text>
    <text x="337.9" y="36">16 Nov</text>
    <text x="434.9" y="36">23 Nov</text>
    <text x="531.9" y="36">30 Nov</text>
    <text x="628.9" y="36">7 Dec</text>
    <text x="725.9" y="36">14 Dec</text>
  </g>

  <g fill="#222">
    <text x="12" y="76" font-weight="bold">Sprint 1</text><text x="12" y="93" font-size="12" fill="#666">9 features</text>
    <text x="12" y="131" font-weight="bold">Sprint 2</text><text x="12" y="148" font-size="12" fill="#666">6 features</text>
    <text x="12" y="186" font-weight="bold">Sprint 3</text><text x="12" y="203" font-size="12" fill="#666">2 features</text>
    <text x="12" y="241" font-weight="bold">Exams</text>
    <text x="12" y="296" font-weight="bold">Checkpoints</text>
    <text x="12" y="340" font-weight="bold">Labs due</text>
  </g>

  <path d="M130 64 L254.7 64 L254.7 94 L130 94 L122 79 Z" fill="#dcebf9" stroke="#185fa5"/>
  <text x="140" y="84" fill="#0c447c" font-size="13">from 6 Oct</text>
  <path d="M254.7 69 l10 10 l-10 10 l-10 -10 z" fill="#185fa5"/>
  <text x="270" y="84" fill="#0c447c" font-weight="bold">v1.0 · 10 Nov</text>

  <rect x="268.6" y="119" width="249.4" height="30" rx="5" fill="#d9f2e8" stroke="#0f6e56"/>
  <text x="280" y="139" fill="#085041">F-05, F-11 to F-15</text>

  <rect x="531.9" y="174" width="180.1" height="30" rx="5" fill="#fbeacc" stroke="#854f0b"/>
  <text x="542" y="194" fill="#633806">F-16, F-17, hardening</text>

  <rect x="545.7" y="229" width="138.6" height="30" rx="5" fill="#eeece6" stroke="#888780"/>
  <text x="615" y="249" fill="#444" text-anchor="middle">1–11 Dec</text>

  <g fill="#222">
    <path d="M324 280 l10 10 l-10 10 l-10 -10 z"/>
    <path d="M518 280 l10 10 l-10 10 l-10 -10 z"/>
    <path d="M712 280 l10 10 l-10 10 l-10 -10 z"/>
  </g>
  <g fill="#222" font-size="13" text-anchor="middle">
    <text x="324" y="318">D1 · 15 Nov</text>
    <text x="518" y="318">D2 · 29 Nov</text>
    <text x="700" y="318">Final · 13 Dec</text>
  </g>

  <g fill="#888780">
    <circle cx="324" cy="336" r="7"/>
    <circle cx="421" cy="336" r="7"/>
    <circle cx="518" cy="336" r="7"/>
  </g>
  <g fill="#444" font-size="13">
    <text x="336" y="341">Lab 5</text>
    <text x="433" y="341">Lab 6</text>
    <text x="530" y="341">Lab 7</text>
  </g>

  <text x="12" y="385" font-size="12" fill="#666">Sources: Group Work Specification §4; D1 due date from LEB2 (read 2026-11-13; handout: 8 Nov); v1.0 tag date from Git.</text>
</svg>
